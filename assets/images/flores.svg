<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6c9e99"/>
      <stop offset="1" stop-color="#244f4d"/>
    </linearGradient>
    <filter id="blur" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="16"/></filter>
    <g id="bloom">
      <circle r="34" fill="#f2d9a2"/>
      <g fill="#f7efe1">
        <ellipse cx="0" cy="-46" rx="22" ry="34"/><ellipse cx="0" cy="46" rx="22" ry="34"/>
        <ellipse cx="-46" cy="0" rx="34" ry="22"/><ellipse cx="46" cy="0" rx="34" ry="22"/>
        <ellipse cx="-33" cy="-33" rx="20" ry="32" transform="rotate(-45 -33 -33)"/>
        <ellipse cx="33" cy="33" rx="20" ry="32" transform="rotate(-45 33 33)"/>
        <ellipse cx="33" cy="-33" rx="20" ry="32" transform="rotate(45 33 -33)"/>
        <ellipse cx="-33" cy="33" rx="20" ry="32" transform="rotate(45 -33 33)"/>
      </g>
      <circle r="18" fill="#c99a2e"/>
    </g>
    <path id="leaf" d="M0 0C40-50 110-60 170-36 120 12 50 22 0 0Z"/>
  </defs>
  <rect width="800" height="1000" fill="url(#bg)"/>
  <g filter="url(#blur)" opacity=".55">
    <circle cx="150" cy="200" r="110" fill="#f3e6c4"/>
    <circle cx="640" cy="320" r="90" fill="#cfe2ec"/>
    <circle cx="420" cy="120" r="60" fill="#f3e6c4"/>
  </g>
  <g stroke="#3f6a3a" stroke-width="5" fill="none">
    <path d="M260 1000C250 860 280 700 250 520"/>
    <path d="M420 1000C430 840 470 640 520 430"/>
    <path d="M600 1000C590 880 610 760 640 660"/>
  </g>
  <g fill="#5f7f4e">
    <use href="#leaf" transform="translate(255 760) rotate(-20)"/>
    <use href="#leaf" transform="translate(255 860) rotate(-160) scale(.9)"/>
    <use href="#leaf" transform="translate(450 760) rotate(-25) scale(.85)"/>
    <use href="#leaf" transform="translate(600 880) rotate(-150) scale(.8)"/>
  </g>
  <use href="#bloom" transform="translate(250 520) scale(1.15)"/>
  <use href="#bloom" transform="translate(520 430) scale(1.3)"/>
  <use href="#bloom" transform="translate(640 660) scale(.85)"/>
  <rect width="800" height="1000" fill="#1d4746" opacity=".12"/>
